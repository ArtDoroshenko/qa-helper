{% extends "account/base_entrance.html" %}

{% block head_title %}Выход{% endblock head_title %}

{% block content %}
    <h1>Выйти из аккаунта?</h1>
    <p class="auth-intro">Для следующего входа снова понадобятся email и пароль.</p>
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {{ redirect_field }}
        <button type="submit">Выйти</button>
    </form>
    <div class="auth-links"><a href="{% url 'dashboard' %}">Остаться в аккаунте</a></div>
{% endblock content %}
