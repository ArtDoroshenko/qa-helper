name: qa-helper

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-helper-web:local
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
      DJANGO_PUBLIC_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env.production}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env.production}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:?Set DJANGO_TRUST_X_FORWARDED_PROTO in .env.production}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:?Set DJANGO_SECURE_HSTS_SECONDS in .env.production}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:?Set DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS in .env.production}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:?Set DJANGO_SECURE_HSTS_PRELOAD in .env.production}
      QA_FEEDBACK_ENABLED: "${QA_FEEDBACK_ENABLED:-0}"
      QA_FEEDBACK_FROM: "${QA_FEEDBACK_FROM:-}"
      QA_FEEDBACK_TO: "${QA_FEEDBACK_TO:-}"
      QA_FEEDBACK_SMTP_HOST: "${QA_FEEDBACK_SMTP_HOST:-}"
      QA_FEEDBACK_SMTP_PORT: "${QA_FEEDBACK_SMTP_PORT:-587}"
      QA_FEEDBACK_SMTP_USER: "${QA_FEEDBACK_SMTP_USER:-}"
      QA_FEEDBACK_SMTP_PASSWORD: "${QA_FEEDBACK_SMTP_PASSWORD:-}"
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/healthz/',
          headers={'Host': os.environ['SITE_DOMAIN'], 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.65
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    mem_limit: 96m
    cpus: 0.20
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge:

volumes:
  static_data:
  caddy_data:
  caddy_config:
